name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Production credentials are used only for the production build.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      GITHUB_PAGES: 'true'
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend secret guard
        run: |
          if git grep -n -E 'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|service_role' -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '.github/**'; then
            echo "Service-role credentials or service_role references must not exist in frontend/workflow source."
            exit 1
          fi
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Unit tests
        run: npm run test:unit
      - name: Static lint/security gate
        run: npm run lint
      - name: TypeScript compiler check
        run: npm run typecheck
      - name: Production build
        run: npm run build:verify
      - name: Static route smoke test
        run: npm run test:smoke

  deploy:
    name: Deploy verified build
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild exact production artifact
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GITHUB_PAGES: 'true'
          REPO_NAME: ${{ github.event.repository.name }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
