name: Prepare dependency lockfile

on:
  push:
    branches: [priority-1-dependency-security]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - name: Dependency audit
        run: npm audit --json > audit.json || true
      - name: Print audit summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));
          for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
            console.log(JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, via:v.via, fixAvailable:v.fixAvailable, nodes:v.nodes}, null, 2));
          }
          NODE
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(priority-1): synchronize npm lockfile"
          git push
