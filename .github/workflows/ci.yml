name: CI - Test and Stabilize

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI uses non-production placeholders so fork PRs do not need repository secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      GITHUB_PAGES: 'true'
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Frontend secret guard
        run: |
          if git grep -n -E 'SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|service_role' -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '.github/**'; then
            echo "Service-role credentials or service_role references must not exist in frontend/workflow source."
            exit 1
          fi

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm run test:unit

      - name: Static lint/security gate
        run: npm run lint

      - name: TypeScript compiler check
        run: npm run typecheck

      - name: Production build
        run: npm run build:verify

      - name: Static route smoke test
        run: npm run test:smoke
